# Tag mode against this repository, using the action from this checkout.
#
# This is the full path: tracking comment, branch creation, MCP comment server,
# and (on a pull request) the CI server. Comment "@kiro ..." on an issue or pull
# request to trigger it.
#
# Requires the KIRO_API_KEY secret.
name: Kiro

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    # `assigned` is deliberately absent: set assignee_trigger and add it if
    # you want assignment to start a run.
    types: [opened, labeled]

jobs:
  kiro:
    # Start a runner only when a trigger is actually plausible. Each clause
    # matters on a public repository, where anyone can comment:
    #   - the label clause names the label, so unrelated labels do not fire;
    #   - `assigned` is left out entirely, because assignee_trigger defaults to
    #     empty and such a run could only ever do nothing;
    #   - bot authors are skipped here rather than after the runner has started.
    if: >-
      (
        github.event_name == 'issues' &&
        github.event.action == 'labeled' &&
        github.event.label.name == 'kiro'
      ) || (
        github.event_name == 'issues' &&
        github.event.action == 'opened' &&
        github.event.issue.user.type != 'Bot' &&
        (
          contains(github.event.issue.body, '@kiro') ||
          contains(github.event.issue.title, '@kiro')
        )
      ) || (
        github.event.comment.user.type != 'Bot' &&
        contains(github.event.comment.body, '@kiro')
      ) || (
        github.event.review.user.type != 'Bot' &&
        contains(github.event.review.body, '@kiro')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read # lets Kiro read CI results on a pull request
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so diffs against the base branch work.
          fetch-depth: 0

      - name: Run the action from this checkout
        id: kiro
        uses: ./
        with:
          kiro_api_key: ${{ secrets.KIRO_API_KEY }}
          timeout_minutes: 20
          # This repository's own checks, so Kiro can verify what it changes.
          allowed_shell_commands: "bun install,bun test *,bun run typecheck,bun run format:check"
          # The Kiro ghost, floating, in place of the ⏳. Sixteen frames of an
          # APNG whose only per-frame difference is a vertical offset. It is
          # 44x54, so the display size keeps that ratio rather than squaring it,
          # and 18px rather than 14 because at 14 the two eyes merge into one
          # line. Attachment uploaded to this repository, which is public, so it
          # loads for anyone reading the comment.
          #
          # No style attribute: GitHub's sanitiser drops it and substitutes its
          # own (max-height, aspect-ratio), so only width/height/alt survive.
          working_indicator: '<img src="https://github.com/user-attachments/assets/b16d4a66-5c85-485d-9b9c-bd0c9549265f" width="15" height="18" alt="" />'

      - name: Upload the CLI output
        if: always() && steps.kiro.outputs.execution_file != ''
        uses: actions/upload-artifact@v7
        with:
          name: kiro-output
          path: ${{ steps.kiro.outputs.execution_file }}
          if-no-files-found: warn
