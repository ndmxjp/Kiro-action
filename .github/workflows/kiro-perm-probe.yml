# Diagnostic workflow: find out what the Kiro CLI actually permits in
# --no-interactive mode. Run by hand; not part of the action.
#
# Round 1 established, on kiro-cli 2.18.1 (what the install script ships):
#   - default agent, no flags .................. everything denied
#   - --trust-all-tools ........................ everything allowed, incl. curl
#   - agent-scoped permissions.rules ........... ignored (CLI 3.0 feature)
#   - user-scoped permissions.yaml ............. ignored (CLI 3.0 feature)
# Denials all read "non-interactive mode (no user to approve)", i.e. anything
# not pre-trusted is refused because there is nobody to prompt.
#
# Round 2 (this file) tests the mechanisms that 2.x actually documents:
# `--trust-tools` for per-tool trust, and `toolsSettings.execute_bash`
# (allowedCommands / deniedCommands) for per-command scoping. The question that
# decides this action's security model is whether shell can be limited to git
# while file writes still work.
#
# Round 3 (kiro-cli 2.21.1) checks two things the follow-up on the tracking
# issue raised from a source reading of kiro-cli main, neither of which can be
# measured off a runner:
#   - Cases CC/DD: a DUAL-BLOCK profile (both toolsSettings AND
#     permissions.rules, in the action's exact scoped shape) run on
#     `--agent-engine v2` and `--agent-engine v3`. The 2.18.1 result was that v2
#     DROPS a config carrying a permissions block; the source says the MIGRATED
#     dual-block shape is instead accepted (to_v3_compatible_str_pretty,
#     migration::upgrade_agent_config, is_kas_only_agent_config; kirodotdev/
#     Kiro#10733). These cases are the decisive re-measurement: do v2 and v3
#     each still honour their own block when the other block is also present?
#   - Case EE: which engine a BARE `chat --no-interactive` run actually uses
#     versus `--agent-engine v1|v2|v3`. The source reading of
#     default_engine_choice (chat/mod.rs:700) predicts a bare run is v1, so the
#     action now passes --agent-engine explicitly. Recorded here, not asserted.
# The dual-block emission in src/kiro/agent-config.ts stays gated off until these
# cases run and the outcome is written into docs/security.md.
name: Kiro permission probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
      KIRO_LOG_NO_COLOR: "1"
      NO_COLOR: "1"
      TERM: dumb
      WRITE_ONLY: |
        Create a file named probe-write.txt containing the text ok. Do not run any shell command. Report whether it worked, quoting any refusal.
      SHELL_SCOPED: |
        Attempt both of these in order, then report each outcome, quoting any refusal verbatim:
        1. Run the shell command: git status --short
        2. Run the shell command: curl -s https://example.com
    steps:
      - uses: actions/checkout@v7

      - name: Install the Kiro CLI
        run: |
          set -o pipefail
          curl -fsSL https://cli.kiro.dev/install | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Record the CLI version
        run: kiro-cli --version

      - name: Write the probe agent configs
        run: |
          mkdir -p ~/.kiro/agents

          # 2.x-style config: allowedTools for pre-approval, toolsSettings for
          # per-command scoping of the shell tool.
          cat > ~/.kiro/agents/probe-2x.json <<'JSON'
          {
            "name": "probe-2x",
            "description": "Permission probe, CLI 2.x schema",
            "prompt": "You are running in CI. Attempt what you are asked and report the outcome verbatim.",
            "mcpServers": {},
            "tools": ["fs_read", "fs_write", "execute_bash", "grep", "glob"],
            "allowedTools": ["fs_read", "fs_write", "grep", "glob"],
            "toolsSettings": {
              "execute_bash": {
                "allowedCommands": ["^git status.*$", "^git add .*$", "^git commit .*$"],
                "deniedCommands": ["^curl", "^wget", "^sudo", "^rm "],
                "denyByDefault": true
              },
              "fs_write": {
                "allowedPaths": ["./**"]
              }
            }
          }
          JSON

          kiro-cli agent validate ~/.kiro/agents/probe-2x.json || true
          echo "--- config as written:"
          cat ~/.kiro/agents/probe-2x.json

      - name: "Case F — --trust-tools with write but not shell (write-only task)"
        run: |
          rm -f probe-write.txt
          kiro-cli chat --no-interactive --trust-tools=fs_read,fs_write "$WRITE_ONLY" || echo "EXIT=$?"
          echo "file exists: $([ -f probe-write.txt ] && echo yes || echo no)"

      - name: "Case G — 2.x agent allowedTools only, no flags (write-only task)"
        run: |
          rm -f probe-write.txt
          kiro-cli chat --no-interactive --agent probe-2x "$WRITE_ONLY" || echo "EXIT=$?"
          echo "file exists: $([ -f probe-write.txt ] && echo yes || echo no)"

      - name: "Case H — 2.x agent, --trust-tools includes shell, allowedCommands scoped to git"
        run: |
          kiro-cli chat --no-interactive --agent probe-2x \
            --trust-tools=fs_read,fs_write,execute_bash "$SHELL_SCOPED" || echo "EXIT=$?"

      - name: "Case I — same agent with --trust-all-tools (does it bypass allowedCommands?)"
        run: |
          kiro-cli chat --no-interactive --agent probe-2x --trust-all-tools "$SHELL_SCOPED" || echo "EXIT=$?"

      - name: "Case J — --trust-tools with the alias names (write/shell) rather than tool names"
        run: |
          rm -f probe-write.txt
          kiro-cli chat --no-interactive --trust-tools=read,write "$WRITE_ONLY" || echo "EXIT=$?"
          echo "file exists: $([ -f probe-write.txt ] && echo yes || echo no)"

      - name: "Case K — toolsSettings only, no tool trusted (the decisive case)"
        run: |
          rm -f probe-write.txt
          cat > ~/.kiro/agents/probe-scoped.json <<'JSON'
          {
            "name": "probe-scoped",
            "description": "Scoped probe: nothing trusted wholesale",
            "prompt": "You are running in CI. Attempt what you are asked and report each outcome verbatim.",
            "mcpServers": {},
            "tools": ["fs_read", "fs_write", "execute_bash", "grep", "glob"],
            "allowedTools": ["fs_read", "grep", "glob"],
            "toolsSettings": {
              "execute_bash": {
                "allowedCommands": ["^git status.*$", "^git add .*$", "^git commit .*$"],
                "deniedCommands": ["^curl", "^wget", "^sudo", "^rm "]
              },
              "fs_write": {
                "allowedPaths": ["./**"]
              }
            }
          }
          JSON
          kiro-cli agent validate ~/.kiro/agents/probe-scoped.json || true
          kiro-cli chat --no-interactive --agent probe-scoped "Attempt all three in order and report each outcome, quoting any refusal verbatim: 1. Run the shell command: git status --short  2. Run the shell command: curl -s https://example.com  3. Create a file named probe-write.txt containing the text ok" || echo "EXIT=$?"
          echo "file exists: $([ -f probe-write.txt ] && echo yes || echo no)"

      - name: "Does this build expose a V3 mode?"
        run: |
          kiro-cli --help-all 2>&1 | grep -iE "v3|version" || true
          echo "--- chat help:"
          kiro-cli chat --help 2>&1 | grep -iE "v3" || echo "  (no --v3 flag in chat help)"

      - name: "Case L — V3 mode with agent-scoped permissions.rules"
        run: |
          mkdir -p ~/.kiro/agents
          cat > ~/.kiro/agents/probe-3x.json <<'JSON'
          {
            "name": "probe-3x",
            "description": "Permission probe, CLI 3.x schema",
            "prompt": "You are running in CI. Attempt what you are asked and report each outcome verbatim.",
            "mcpServers": {},
            "tools": ["fs_read", "fs_write", "execute_bash", "grep", "glob"],
            "permissions": {
              "rules": [
                { "capability": "shell", "match": ["git *"], "effect": "allow" },
                { "capability": "shell", "match": ["curl *", "wget *"], "effect": "deny" },
                { "capability": "fs_write", "match": ["./**"], "effect": "allow" },
                { "capability": "fs_read", "effect": "allow" }
              ]
            },
            "includeMcpJson": false
          }
          JSON
          rm -f probe-write.txt ~/.kiro/settings/permissions.yaml
          kiro-cli chat --v3 --no-interactive --agent probe-3x "Attempt all three in order and report each outcome, quoting any refusal verbatim: 1. Run the shell command: git status --short  2. Run the shell command: curl -s https://example.com  3. Create a file named probe-write.txt containing the text ok" || echo "EXIT=$?"
          echo "file exists: $([ -f probe-write.txt ] && echo yes || echo no)"

      - name: "Case M — V3 mode with user-scoped permissions.yaml"
        run: |
          mkdir -p ~/.kiro/settings
          cat > ~/.kiro/settings/permissions.yaml <<'YAML'
          rules:
            - capability: shell
              match: ["git *"]
              effect: allow
            - capability: shell
              match: ["curl *"]
              effect: deny
            - capability: fs_write
              effect: allow
            - capability: fs_read
              effect: allow
          YAML
          rm -f probe-write.txt
          kiro-cli chat --v3 --no-interactive "Attempt all three in order and report each outcome, quoting any refusal verbatim: 1. Run the shell command: git status --short  2. Run the shell command: curl -s https://example.com  3. Create a file named probe-write.txt containing the text ok" || echo "EXIT=$?"
          echo "file exists: $([ -f probe-write.txt ] && echo yes || echo no)"

      - name: "Case N — V3: do our own allow rules cover git writes, and is fs_write scoped?"
        run: |
          rm -f ~/.kiro/settings/permissions.yaml
          cat > ~/.kiro/agents/probe-3x-scoped.json <<'JSON'
          {
            "name": "probe-3x-scoped",
            "description": "V3 probe: git writes allowed, workspace-scoped writes",
            "prompt": "You are running in CI. Attempt what you are asked and report each outcome verbatim, including the exact refusal text.",
            "mcpServers": {},
            "tools": ["fs_read", "fs_write", "execute_bash", "grep", "glob"],
            "permissions": {
              "rules": [
                { "capability": "fs_read", "effect": "allow" },
                { "capability": "fs_write", "match": ["./**"], "effect": "allow" },
                { "capability": "shell", "match": ["git add *", "git commit *", "git status*"], "effect": "allow" },
                { "capability": "shell", "match": ["curl *", "sudo *", "rm -rf *"], "effect": "deny" }
              ]
            },
            "includeMcpJson": false
          }
          JSON
          git config user.email "probe@example.com"
          git config user.name "Probe"
          kiro-cli chat --v3 --no-interactive --agent probe-3x-scoped "Attempt all four in order and report each outcome, quoting refusals verbatim: 1. Create a file named probe-in-repo.txt containing ok  2. Create a file named /tmp/probe-outside-repo.txt containing ok  3. Run the shell command: git add probe-in-repo.txt  4. Run the shell command: git commit -m probe" || echo "EXIT=$?"
          echo "--- in-repo file: $([ -f probe-in-repo.txt ] && echo yes || echo no)"
          echo "--- outside-repo file: $([ -f /tmp/probe-outside-repo.txt ] && echo yes || echo no)"
          echo "--- commits since HEAD~1:"
          git log --oneline -2 || true

      - name: "Case O — V3: are MCP tools usable, and does an mcp deny rule bite?"
        run: |
          mkdir -p /tmp/mcp
          cat > /tmp/mcp/server.mjs <<'MJS'
          // Minimal MCP stdio server exposing one tool, so the probe does not
          // depend on this action's own servers (which need GitHub context).
          import { McpServer } from "@modelcontextprotocol/sdk/server/mcp.js";
          import { StdioServerTransport } from "@modelcontextprotocol/sdk/server/stdio.js";
          import { z } from "zod";
          const server = new McpServer({ name: "probe-mcp", version: "0.0.1" });
          server.tool("echo_probe", "Echo a string back", { text: z.string() }, async ({ text }) => ({
            content: [{ type: "text", text: `echo:${text}` }],
          }));
          await server.connect(new StdioServerTransport());
          MJS
          cd /tmp/mcp && npm install --silent @modelcontextprotocol/sdk zod >/dev/null 2>&1
          cd "$GITHUB_WORKSPACE"
          cat > ~/.kiro/agents/probe-3x-mcp.json <<JSON
          {
            "name": "probe-3x-mcp",
            "description": "V3 probe: MCP tool permission",
            "prompt": "You are running in CI. Do what you are asked and report the outcome verbatim.",
            "mcpServers": {
              "probe": { "command": "node", "args": ["/tmp/mcp/server.mjs"] }
            },
            "tools": ["fs_read", "@probe"],
            "permissions": {
              "rules": [
                { "capability": "fs_read", "effect": "allow" },
                { "capability": "mcp", "match": ["probe/*"], "effect": "allow" }
              ]
            },
            "includeMcpJson": false
          }
          JSON
          kiro-cli chat --v3 --no-interactive --require-mcp-startup --agent probe-3x-mcp "Call the echo_probe tool with text=hello and report exactly what it returned, or quote the refusal." || echo "EXIT=$?"

      - name: "MCP preflight — does the throwaway server actually start?"
        run: |
          mkdir -p /tmp/mcp2
          cat > /tmp/mcp2/server.mjs <<'MJS'
          import { McpServer } from "@modelcontextprotocol/sdk/server/mcp.js";
          import { StdioServerTransport } from "@modelcontextprotocol/sdk/server/stdio.js";
          import { z } from "zod";
          const server = new McpServer({ name: "probe-mcp", version: "0.0.1" });
          server.tool("echo_probe", "Echo a string back", { text: z.string() }, async ({ text }) => ({
            content: [{ type: "text", text: `echo:${text}` }],
          }));
          await server.connect(new StdioServerTransport());
          MJS
          cd /tmp/mcp2
          npm install --no-audit --no-fund @modelcontextprotocol/sdk zod 2>&1 | tail -2
          # Speak just enough MCP to prove the server responds to initialize.
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"probe","version":"0"}}}' \
            | timeout 10 node /tmp/mcp2/server.mjs | head -c 400 || true
          echo
          echo "(a JSON-RPC result above means the server works)"

      - name: "Case P — V3 with MCP, no tools field (everything available)"
        run: |
          cat > ~/.kiro/agents/probe-mcp-p.json <<'JSON'
          {
            "name": "probe-mcp-p",
            "description": "V3 MCP probe: no tools field",
            "prompt": "You are running in CI. List the tools you can see, then do what you are asked.",
            "mcpServers": { "probe": { "command": "node", "args": ["/tmp/mcp2/server.mjs"] } },
            "permissions": {
              "rules": [
                { "capability": "fs_read", "effect": "allow" },
                { "capability": "mcp", "match": ["probe/*"], "effect": "allow" }
              ]
            },
            "includeMcpJson": false
          }
          JSON
          kiro-cli chat --v3 --no-interactive --require-mcp-startup --agent probe-mcp-p "First list every tool name you can see. Then call echo_probe with text=hello and report exactly what it returned, or quote the refusal." || echo "EXIT=$?"

      - name: "Case Q — V3 with MCP, tools uses the @server/tool form"
        run: |
          cat > ~/.kiro/agents/probe-mcp-q.json <<'JSON'
          {
            "name": "probe-mcp-q",
            "description": "V3 MCP probe: @server/tool in tools",
            "prompt": "You are running in CI. List the tools you can see, then do what you are asked.",
            "mcpServers": { "probe": { "command": "node", "args": ["/tmp/mcp2/server.mjs"] } },
            "tools": ["fs_read", "@probe/echo_probe"],
            "permissions": {
              "rules": [
                { "capability": "fs_read", "effect": "allow" },
                { "capability": "mcp", "match": ["probe/*"], "effect": "allow" }
              ]
            },
            "includeMcpJson": false
          }
          JSON
          kiro-cli chat --v3 --no-interactive --require-mcp-startup --agent probe-mcp-q "First list every tool name you can see. Then call echo_probe with text=hello and report exactly what it returned, or quote the refusal." || echo "EXIT=$?"

      - name: "Case R — V2 (default engine) with MCP and allowedTools"
        run: |
          cat > ~/.kiro/agents/probe-mcp-r.json <<'JSON'
          {
            "name": "probe-mcp-r",
            "description": "V2 MCP probe",
            "prompt": "You are running in CI. List the tools you can see, then do what you are asked.",
            "mcpServers": { "probe": { "command": "node", "args": ["/tmp/mcp2/server.mjs"] } },
            "tools": ["fs_read", "@probe"],
            "allowedTools": ["fs_read", "@probe"],
            "includeMcpJson": false
          }
          JSON
          kiro-cli chat --no-interactive --require-mcp-startup --agent probe-mcp-r "First list every tool name you can see. Then call echo_probe with text=hello and report exactly what it returned, or quote the refusal." || echo "EXIT=$?"

      - name: "Case S — V3: mcpServers present, tools lists only built-ins"
        run: |
          cat > ~/.kiro/agents/probe-s.json <<'JSON'
          {
            "name": "probe-s",
            "description": "V3: mcpServers plus a built-in-only tools list",
            "prompt": "You are running in CI. List every tool name you can see, then do what you are asked.",
            "mcpServers": { "probe": { "command": "node", "args": ["/tmp/mcp2/server.mjs"] } },
            "tools": ["fs_read", "grep"],
            "permissions": {
              "rules": [
                { "capability": "fs_read", "effect": "allow" },
                { "capability": "mcp", "match": ["probe/*"], "effect": "allow" }
              ]
            },
            "includeMcpJson": false
          }
          JSON
          kiro-cli chat --v3 --no-interactive --agent probe-s "List every tool name you can see, one per line. Then try to call echo_probe with text=hello and report the result or the refusal." || echo "EXIT=$?"

      - name: "Case T — V3: no mcpServers and no tools field (is an absent tools list empty?)"
        run: |
          cat > ~/.kiro/agents/probe-t.json <<'JSON'
          {
            "name": "probe-t",
            "description": "V3: no mcpServers, no tools field",
            "prompt": "You are running in CI. List every tool name you can see.",
            "permissions": {
              "rules": [{ "capability": "fs_read", "effect": "allow" }]
            }
          }
          JSON
          kiro-cli chat --v3 --no-interactive --agent probe-t "List every tool name you can see, one per line." || echo "EXIT=$?"

      - name: "Case U — V3: server declared in ~/.kiro/settings/mcp.json with includeMcpJson"
        run: |
          mkdir -p ~/.kiro/settings
          cat > ~/.kiro/settings/mcp.json <<'JSON'
          {
            "mcpServers": {
              "probe": { "command": "node", "args": ["/tmp/mcp2/server.mjs"] }
            }
          }
          JSON
          cat > ~/.kiro/agents/probe-u.json <<'JSON'
          {
            "name": "probe-u",
            "description": "V3: MCP via mcp.json",
            "prompt": "You are running in CI. List every tool name you can see, then do what you are asked.",
            "tools": ["fs_read", "grep"],
            "includeMcpJson": true,
            "permissions": {
              "rules": [
                { "capability": "fs_read", "effect": "allow" },
                { "capability": "mcp", "match": ["probe/*"], "effect": "allow" }
              ]
            }
          }
          JSON
          kiro-cli chat --v3 --no-interactive --agent probe-u "List every tool name you can see, one per line. Then call echo_probe with text=hello and report exactly what it returned, or quote the refusal." || echo "EXIT=$?"

      - name: "Case V — V3: tools uses the @server tag form"
        run: |
          rm -f ~/.kiro/settings/mcp.json
          cat > ~/.kiro/agents/probe-v.json <<'JSON'
          {
            "name": "probe-v",
            "description": "V3: @server tag in tools",
            "prompt": "You are running in CI. List every tool name you can see, then do what you are asked.",
            "mcpServers": { "probe": { "command": "node", "args": ["/tmp/mcp2/server.mjs"] } },
            "tools": ["fs_read", "grep", "@probe"],
            "permissions": {
              "rules": [
                { "capability": "fs_read", "effect": "allow" },
                { "capability": "mcp", "effect": "allow" }
              ]
            },
            "includeMcpJson": false
          }
          JSON
          kiro-cli chat --v3 --no-interactive --agent probe-v "List every tool name you can see, one per line. Then call echo_probe with text=hello and report exactly what it returned, or quote the refusal." || echo "EXIT=$?"

      - name: "Case W — V2 baseline for the same mcp.json wiring"
        run: |
          mkdir -p ~/.kiro/settings
          cat > ~/.kiro/settings/mcp.json <<'JSON'
          {
            "mcpServers": {
              "probe": { "command": "node", "args": ["/tmp/mcp2/server.mjs"] }
            }
          }
          JSON
          kiro-cli chat --no-interactive --agent probe-u "List every tool name you can see, one per line. Then call echo_probe with text=hello and report exactly what it returned, or quote the refusal." || echo "EXIT=$?"

      - name: "Case X — V2: toolsSettings in the documented plain form, tool NOT trusted"
        run: |
          rm -f ~/.kiro/settings/mcp.json
          cat > ~/.kiro/agents/probe-x.json <<'JSON'
          {
            "name": "probe-x",
            "description": "V2: allowedCommands without trusting the tool",
            "prompt": "You are running in CI. Attempt what you are asked and report each outcome verbatim.",
            "mcpServers": {},
            "tools": ["fs_read", "grep", "glob", "execute_bash"],
            "allowedTools": ["fs_read", "grep", "glob"],
            "toolsSettings": {
              "shell": {
                "allowedCommands": ["git status.*", "git add .*", "git commit .*"],
                "deniedCommands": ["curl .*", "sudo .*"],
                "autoAllowReadonly": true
              }
            }
          }
          JSON
          kiro-cli agent validate --path ~/.kiro/agents/probe-x.json || true
          kiro-cli chat --no-interactive --agent probe-x "Attempt both and report each outcome, quoting refusals verbatim: 1. Run the shell command: git status --short  2. Run the shell command: curl -s https://example.com" || echo "EXIT=$?"

      - name: "Case Y — V2: exact allowedCommands entry, exact command asked for"
        run: |
          cat > ~/.kiro/agents/probe-y.json <<'JSON'
          {
            "name": "probe-y",
            "description": "V2: exact-match allowedCommands",
            "prompt": "You are running in CI. Run exactly the command you are asked for and report the outcome verbatim.",
            "mcpServers": {},
            "tools": ["fs_read", "execute_bash"],
            "allowedTools": ["fs_read"],
            "toolsSettings": {
              "shell": { "allowedCommands": ["git status"], "denyByDefault": true }
            }
          }
          JSON
          kiro-cli chat --no-interactive --agent probe-y "Run exactly this shell command, with no flags: git status — then report the outcome, quoting any refusal verbatim." || echo "EXIT=$?"

      - name: "Case Z — V2: is the shell tool needed at all if an MCP server runs the command?"
        run: |
          mkdir -p /tmp/mcp3
          cat > /tmp/mcp3/server.mjs <<'MJS'
          // Stands in for a narrow, action-owned tool: it runs one fixed command
          // and nothing else, so trusting the whole server is still safe.
          import { McpServer } from "@modelcontextprotocol/sdk/server/mcp.js";
          import { StdioServerTransport } from "@modelcontextprotocol/sdk/server/stdio.js";
          import { execFileSync } from "child_process";
          const server = new McpServer({ name: "checks", version: "0.0.1" });
          server.tool("run_repo_checks", "Run the repository's checks", {}, async () => {
            const out = execFileSync("git", ["status", "--short"], { encoding: "utf8" });
            return { content: [{ type: "text", text: `git status --short:\n${out || "(clean)"}` }] };
          });
          await server.connect(new StdioServerTransport());
          MJS
          cd /tmp/mcp3 && npm install --no-audit --no-fund @modelcontextprotocol/sdk zod >/dev/null 2>&1
          cd "$GITHUB_WORKSPACE"
          cat > ~/.kiro/agents/probe-z.json <<'JSON'
          {
            "name": "probe-z",
            "description": "V2: narrow MCP tool instead of shell",
            "prompt": "You are running in CI. Use the tools you have and report the outcome verbatim.",
            "mcpServers": { "checks": { "command": "node", "args": ["/tmp/mcp3/server.mjs"] } },
            "tools": ["fs_read", "@checks"],
            "allowedTools": ["fs_read", "@checks"],
            "includeMcpJson": false
          }
          JSON
          kiro-cli chat --no-interactive --require-mcp-startup --agent probe-z "Call run_repo_checks and report exactly what it returned, or quote the refusal." || echo "EXIT=$?"

      - name: "Case AA — V2: write path-scoped via toolsSettings, tool NOT trusted"
        run: |
          rm -f probe-in-repo.txt /tmp/probe-outside-repo.txt
          cat > ~/.kiro/agents/probe-aa.json <<'JSON'
          {
            "name": "probe-aa",
            "description": "V2: allowedPaths without trusting the write tool",
            "prompt": "You are running in CI. Attempt what you are asked and report each outcome verbatim.",
            "mcpServers": {},
            "tools": ["fs_read", "grep", "glob", "fs_write", "execute_bash"],
            "allowedTools": ["fs_read", "grep", "glob"],
            "toolsSettings": {
              "write": { "allowedPaths": ["./**"] },
              "shell": {
                "allowedCommands": ["git status.*", "git add .*", "git commit .*"],
                "deniedCommands": ["curl .*", "sudo .*", "git push .*"],
                "autoAllowReadonly": true
              }
            }
          }
          JSON
          git config user.email probe@example.com
          git config user.name Probe
          kiro-cli chat --no-interactive --agent probe-aa "Attempt all five in order, one at a time, and report each outcome quoting refusals verbatim: 1. Create probe-in-repo.txt in the current directory containing ok  2. Create /tmp/probe-outside-repo.txt containing ok  3. Run: git add probe-in-repo.txt  4. Run: git commit -m probe  5. Run: git push origin main" || echo "EXIT=$?"
          echo "--- in-repo file:      $([ -f probe-in-repo.txt ] && echo yes || echo no)"
          echo "--- outside-repo file: $([ -f /tmp/probe-outside-repo.txt ] && echo yes || echo no)"
          echo "--- last commit:"; git log --oneline -1

      - name: "Case BB — does anything survive the CLI in --v3 --no-interactive?"
        run: |
          cat > ~/.kiro/agents/probe-bb.json <<'JSON'
          {
            "name": "probe-bb",
            "description": "Lifecycle probe",
            "prompt": "You are running in CI. Answer briefly.",
            "mcpServers": {},
            "permissions": { "rules": [{ "capability": "fs_read", "effect": "allow" }] }
          }
          JSON
          echo "--- processes before:"
          pgrep -fa "kiro|kas" || echo "  (none)"

          # Run the CLI with its output through a pipe, exactly as a CI wrapper
          # would, and record when the CLI process itself exits.
          ( kiro-cli chat --v3 --no-interactive --agent probe-bb "Reply with the single word: done" > /tmp/bb-out.txt 2>&1 & echo $! > /tmp/bb.pid )
          CLI_PID=$(cat /tmp/bb.pid)
          echo "--- CLI pid: $CLI_PID"
          for i in $(seq 1 60); do
            kill -0 "$CLI_PID" 2>/dev/null || { echo "--- CLI exited after ${i}s"; break; }
            sleep 1
          done

          echo "--- CLI output:"; cat /tmp/bb-out.txt | sed 's/\x1b\[[0-9;?]*[a-zA-Z]//g' | tail -5
          echo "--- processes 5s after the CLI exited:"
          sleep 5
          pgrep -fa "kiro|kas" || echo "  (none survived)"

          echo "--- who holds the pipe (fd table of survivors):"
          for pid in $(pgrep -f "kas|kiro" || true); do
            echo "  pid $pid: $(tr '\0' ' ' < /proc/$pid/cmdline 2>/dev/null | cut -c1-120)"
            ls -l /proc/$pid/fd 2>/dev/null | grep -c pipe | sed 's/^/    open pipes: /'
          done

          # A parent that waits for stdout to close, which is what a naive
          # wrapper does. Times out if the pipe is still held.
          echo "--- can a parent that waits for EOF on stdout finish?"
          timeout 30 node -e '
            const { spawn } = require("child_process");
            const t0 = Date.now();
            const c = spawn("kiro-cli", ["chat","--v3","--no-interactive","--agent","probe-bb","Reply with the single word: done"], { stdio: ["ignore","pipe","pipe"] });
            c.stdout.on("data", () => {});
            c.stderr.on("data", () => {});
            c.on("exit", (code) => console.log(`  exit event after ${((Date.now()-t0)/1000).toFixed(1)}s, code=${code}`));
            c.on("close", () => console.log(`  close event after ${((Date.now()-t0)/1000).toFixed(1)}s`));
          ' || echo "  (the node parent was still waiting after 30s — close never fired)"

      - name: "Write the dual-block probe agent config"
        run: |
          mkdir -p ~/.kiro/agents
          # The action's exact scoped shape, but with BOTH blocks in one profile:
          # execute_bash/fs_write in tools and NOT in allowedTools; writes scoped
          # to ./** by both toolsSettings.write and a permissions fs_write rule;
          # git allowed and curl denied by both toolsSettings.shell and the
          # permissions shell rules. This is the migrated dual-block shape the
          # source says KAS accepts; the 2.18.1 result was that v2 dropped a
          # permissions-carrying config, so these cases decide whether that still
          # holds on 2.21.1.
          cat > ~/.kiro/agents/probe-dual.json <<'JSON'
          {
            "name": "probe-dual",
            "description": "Dual-block probe: classic toolsSettings + v3 permissions in one profile",
            "prompt": "You are running in CI. Attempt what you are asked and report each outcome verbatim, quoting any refusal.",
            "mcpServers": {},
            "tools": ["fs_read", "grep", "glob", "fs_write", "execute_bash"],
            "allowedTools": ["fs_read", "grep", "glob"],
            "toolsSettings": {
              "write": { "allowedPaths": ["./**"] },
              "shell": {
                "allowedCommands": ["git status( .*)?", "git diff( .*)?"],
                "deniedCommands": ["curl( .*)?", "wget( .*)?", "git push( .*)?"],
                "denyByDefault": true
              }
            },
            "permissions": {
              "rules": [
                { "capability": "fs_read", "effect": "allow" },
                { "capability": "fs_write", "match": ["./**"], "effect": "allow" },
                { "capability": "shell", "match": ["git status", "git status *", "git diff", "git diff *"], "effect": "allow" },
                { "capability": "shell", "match": ["curl *", "wget *", "git push *"], "effect": "deny" }
              ]
            },
            "includeMcpJson": false
          }
          JSON
          kiro-cli agent validate ~/.kiro/agents/probe-dual.json || true
          echo "--- config as written:"
          cat ~/.kiro/agents/probe-dual.json

      - name: "Case CC — dual-block profile on --agent-engine v2 (does v2 still drop it?)"
        run: |
          rm -f probe-write.txt /tmp/probe-outside-repo.txt
          kiro-cli chat --no-interactive --agent-engine v2 --agent probe-dual "Attempt all three in order and report each outcome, quoting any refusal verbatim: 1. Run the shell command: git status --short  2. Run the shell command: curl -s https://example.com  3. Create a file named /tmp/probe-outside-repo.txt containing ok" || echo "EXIT=$?"
          echo "--- outside-repo file (should be no if writes are confined): $([ -f /tmp/probe-outside-repo.txt ] && echo yes || echo no)"

      - name: "Case DD — dual-block profile on --agent-engine v3 (does v3 honour permissions?)"
        run: |
          rm -f probe-write.txt /tmp/probe-outside-repo.txt
          kiro-cli chat --no-interactive --agent-engine v3 --agent probe-dual "Attempt all three in order and report each outcome, quoting any refusal verbatim: 1. Run the shell command: git status --short  2. Run the shell command: curl -s https://example.com  3. Create a file named /tmp/probe-outside-repo.txt containing ok" || echo "EXIT=$?"
          echo "--- outside-repo file (should be no if writes are confined): $([ -f /tmp/probe-outside-repo.txt ] && echo yes || echo no)"

      - name: "Case EE — which engine does a bare run use, versus --agent-engine v1/v2/v3?"
        run: |
          # The source reading (default_engine_choice, chat/mod.rs:700) predicts a
          # bare --no-interactive run selects v1. The runStarted event on
          # stream-json carries the engine, so ask for it directly; fall back to
          # whatever the CLI prints.
          echo "=== bare (no --agent-engine flag) ==="
          kiro-cli chat --no-interactive --agent probe-bb --output-format stream-json "Reply with the single word: done" 2>&1 | grep -iE '"engine"|runStarted|not supported|v1|v2|v3' | head -5 || echo "  (no engine line captured)"
          for e in v1 v2 v3; do
            echo "=== --agent-engine $e ==="
            kiro-cli chat --no-interactive --agent-engine "$e" --agent probe-bb --output-format stream-json "Reply with the single word: done" 2>&1 | grep -iE '"engine"|runStarted|not supported' | head -3 || echo "  (no engine line captured)"
          done
          echo "--- for reference, what --help advertises as the default:"
          kiro-cli chat --help 2>&1 | grep -iE "agent-engine|default" | head -5 || true
