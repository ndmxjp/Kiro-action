# Agent mode with a tracking comment: review every pull request as it opens.
#
# `track_progress: true` keeps the tracking comment (so the review is posted to
# the PR) while still using the fixed prompt below instead of waiting for a
# mention.
name: Kiro review

on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ndmxjp/Kiro-action@v0
        with:
          kiro_api_key: ${{ secrets.KIRO_API_KEY }}
          track_progress: true
          # Findings tied to a line go on that line; the verdict stays in the
          # tracking comment. Capped at 20 inline comments per run.
          use_inline_comments: true
          prompt: |
            Review this pull request. Do not modify any files.

            Put each finding that is tied to a specific line on that line with
            create_inline_comment, and keep the overall verdict in the tracking
            comment.

            Focus on, in order:
            1. Correctness — logic errors, unhandled failures, off-by-one bounds.
            2. Security — injected input reaching a shell, a query, or a path.
            3. Missing tests for the behaviour the diff changes.

            Report only what you are confident about, with file:line references.
            If the diff looks fine, say so in one sentence rather than inventing
            nitpicks.
